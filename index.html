<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Being Juice — Hyderabad Nano-Market Decision Engine</title>

  <!-- Leaflet CSS & Awesome Fonts -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body, html { height: 100%; width: 100%; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    #map { height: 100vh; width: 100vw; }

    /* Control Overlay */
    .dashboard-panel {
      position: absolute;
      top: 15px;
      left: 60px;
      z-index: 1000;
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(8px);
      padding: 14px 18px;
      border-radius: 8px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.18);
      border-left: 6px solid #2e7d32;
      max-width: 380px;
    }
    .dashboard-panel h1 { font-size: 17px; color: #1b5e20; margin-bottom: 4px; font-weight: 800; }
    .dashboard-panel p { font-size: 11.5px; color: #444; line-height: 1.4; }
    .badge-bar { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
    .badge-pill { font-size: 10px; font-weight: bold; padding: 2px 8px; border-radius: 12px; color: #fff; }

    /* Popup Styling */
    .popup-box { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; line-height: 1.45; min-width: 260px; }
    .popup-header { color: #fff; padding: 8px 12px; border-radius: 4px 4px 0 0; font-size: 13px; font-weight: 700; }
    .popup-content { padding: 10px 12px; border: 1px solid #ddd; border-top: none; background: #fff; border-radius: 0 0 4px 4px; }
    .kpi-row { display: flex; justify-content: space-between; margin: 4px 0; border-bottom: 1px dashed #eee; padding-bottom: 2px; }
    .kpi-row b { color: #333; }
    .kpi-row span { font-weight: 700; color: #1b5e20; }

    /* Marker Icons */
    .pin-icon {
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      color: white;
      border: 2px solid white;
      box-shadow: 0 2px 6px rgba(0,0,0,0.35);
    }
  </style>
</head>
<body>

  <div class="dashboard-panel">
    <h1>Being Juice — Hyderabad Nano-Market GIS</h1>
    <p>Calibrated for <b>40–50 cups/day (100% Strike Rate)</b> at ₹130–₹250. 3 km Nano-Markets (NM), Corporate Canteens (>₹12L CTC), Gourmet Grocers, & Sports Hubs.</p>
    <div class="badge-bar">
      <span class="badge-pill" style="background:#2e7d32;">Stores</span>
      <span class="badge-pill" style="background:#6a1b9a;">SIS Gourmet</span>
      <span class="badge-pill" style="background:#e65100;">Canteens</span>
      <span class="badge-pill" style="background:#0288d1;">Pickleball & Gyms</span>
      <span class="badge-pill" style="background:#d81b60;">Starbucks / Boba</span>
    </div>
  </div>

  <div id="map"></div>

  <!-- Leaflet & HeatMap Bundle -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/leaflet.heat@0.2.0/dist/leaflet-heat.js"></script>

  <script>
    // 1. Initialize Map
    const map = L.map('map', {
      center: [17.4330, 78.3950],
      zoom: 12,
      zoomControl: true
    });

    // 2. Base Tile Layer (Esri WorldStreetMap - No 403 blocks)
    L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}', {
      attribution: 'Esri &mdash; Being Juice Catchment Intelligence',
      maxZoom: 18
    }).addTo(map);

    // -------------------------------------------------------------
    // ICON BUILDER
    // -------------------------------------------------------------
    function makeIcon(color, faClass) {
      return L.divIcon({
        className: '',
        html: `<div class="pin-icon" style="background:${color}; width:30px; height:30px;"><i class="${faClass}" style="font-size:13px;"></i></div>`,
        iconSize: [30, 30],
        iconAnchor: [15, 15],
        popupAnchor: [0, -15]
      });
    }

    // -------------------------------------------------------------
    // LAYER 1: 3 KM NANO-MARKETS (NM BOUNDARIES)
    // -------------------------------------------------------------
    const nanoMarkets = [
      { name: "NM-01: Knowledge City & Raidurg (3 km)", center: [17.4342, 78.3822], color: "#2e7d32" },
      { name: "NM-02: Financial District & Nanakramguda (3 km)", center: [17.4184, 78.3486], color: "#1565c0" },
      { name: "NM-03: Jubilee Hills & KBR Park (3 km)", center: [17.4338, 78.4069], color: "#6a1b9a" },
      { name: "NM-04: Kokapet & Gandipet (3 km)", center: [17.4045, 78.3248], color: "#e65100" },
      { name: "NM-05: Sainikpuri & AS Rao Nagar (3 km)", center: [17.4890, 78.5470], color: "#00838f" },
      { name: "NM-06: Himayatnagar & Hyderguda (3 km)", center: [17.4020, 78.4840], color: "#c2185b" }
    ];

    const lg_nano = L.layerGroup();
    nanoMarkets.forEach(nm => {
      L.circle(nm.center, {
        radius: 3000,
        color: nm.color,
        weight: 1.8,
        dashArray: "6, 6",
        fillColor: nm.color,
        fillOpacity: 0.07
      }).bindTooltip(`<b>${nm.name}</b>`, { permanent: false }).addTo(lg_nano);
    });

    // -------------------------------------------------------------
    // LAYER 2: CANDIDATE BEING JUICE STORES (40-50 CUPS GUARANTEE)
    // -------------------------------------------------------------
    const lg_stores = L.layerGroup();
    const storeCandidates = [
      {
        name: "Knowledge City Food Concourse",
        coords: [17.4342, 78.3822],
        format: "Format A: Micro Kiosk (80 sq ft)",
        rent: "₹30k - ₹50k base + 12% rev share",
        targetCups: "60 - 90 cups/day",
        peak: "1:30 PM - 5:30 PM",
        why: "45,000 captive corporate employees (JP Morgan, HSBC, Novartis). 50 cups requires just 0.11% capture rate."
      },
      {
        name: "Jubilee Hills Road 36 / 45 Junction",
        coords: [17.4338, 78.4069],
        format: "Format 2: Standalone Walk-in Counter",
        rent: "₹1.4L - ₹2.0L/mo",
        targetCups: "70 - 110 cups/day (AOV ₹320)",
        peak: "6:00 PM - 11:30 PM & Weekend Mornings",
        why: "Highest wealth density in Telangana. Direct clustering next to Third Wave & Boba Bhai."
      },
      {
        name: "KBR Park Main Perimeter Gate",
        coords: [17.4245, 78.4230],
        format: "Format 2: Early-Bird Kiosk (6 AM - 12 PM)",
        rent: "₹35k - ₹60k/mo",
        targetCups: "50 - 80 cups/day",
        peak: "6:00 AM - 10:30 AM",
        why: "6,000+ affluent joggers & walkers daily. Fresh citrus & detox juice matches morning mindset."
      },
      {
        name: "Financial District Waverock Concourse",
        coords: [17.4184, 78.3486],
        format: "Format 3: Canteen Counter",
        rent: "10% - 14% Operator Commission",
        targetCups: "55 - 85 cups/day",
        peak: "12:30 PM - 4:30 PM",
        why: "25,000+ IT staff. Zero delivery packaging costs, immediate cash collection via corporate badge."
      },
      {
        name: "Sainikpuri 5th Avenue High-Street",
        coords: [17.4890, 78.5470],
        format: "Format 2: Boutique Counter",
        rent: "₹45k - ₹70k/mo",
        targetCups: "45 - 65 cups/day",
        peak: "4:00 PM - 10:00 PM",
        why: "Proven cafe culture (Coffee Cup, Groove). Defense & NRI retirement wealth with high daily wellness budget."
      }
    ];

    storeCandidates.forEach(s => {
      const popup = `
        <div class="popup-box">
          <div class="popup-header" style="background:#1b5e20;">${s.name}</div>
          <div class="popup-content">
            <div class="kpi-row"><b>Format:</b> <span>${s.format}</span></div>
            <div class="kpi-row"><b>Target Rent:</b> <span>${s.rent}</span></div>
            <div class="kpi-row"><b>Volume Target:</b> <span>${s.targetCups}</span></div>
            <div class="kpi-row"><b>Peak Window:</b> <span>${s.peak}</span></div>
            <p style="margin-top:6px; color:#555; font-size:11px;"><b>Conversion Logic:</b> ${s.why}</p>
          </div>
        </div>
      `;
      L.marker(s.coords, { icon: makeIcon('#2e7d32', 'fa-solid fa-store') })
        .bindPopup(popup)
        .addTo(lg_stores);
    });

    // -------------------------------------------------------------
    // LAYER 3: GOURMET CONCEPTS & SHOP-IN-SHOP (SIS) PARTNERS
    // -------------------------------------------------------------
    const lg_gourmet = L.layerGroup();
    const gourmetPartners = [
      { name: "Q-Mart Gourmet (Banjara Hills Rd 2)", coords: [17.4225, 78.4312], note: "Highest grocery ticket in Hyderabad; HNW organic shoppers" },
      { name: "Q-Mart Gourmet (Gachibowli ORR)", coords: [17.4398, 78.3541], note: "Serves Financial District CXOs & gated villas" },
      { name: "Ratnadeep Select (Jubilee Hills Rd 36)", coords: [17.4310, 78.4095], note: "Prime high-end grocery footfall with daily affluent repeats" },
      { name: "Nature's Basket (Jubilee Hills Rd 36)", coords: [17.4340, 78.4080], note: "Exotic imported health food and vegan buyer base" },
      { name: "Ratnadeep Select (Financial District)", coords: [17.4170, 78.3490], note: "Captive evening grocery buyers from Prestige High Fields" },
      { name: "Spencer's Gourmet / Ratnadeep (Sainikpuri)", coords: [17.4880, 78.5460], note: "Defense & senior executive grocery traffic" }
    ];

    gourmetPartners.forEach(g => {
      const popup = `
        <div class="popup-box">
          <div class="popup-header" style="background:#4a148c;">${g.name}</div>
          <div class="popup-content">
            <b>Type:</b> Gourmet Grocery SIS Partner<br/>
            <b>Rent Model:</b> 12% - 16% Revenue Share (Low Capex)<br/>
            <b>Audience:</b> ${g.note}
          </div>
        </div>
      `;
      L.marker(g.coords, { icon: makeIcon('#6a1b9a', 'fa-solid fa-basket-shopping') })
        .bindPopup(popup)
        .addTo(lg_gourmet);
    });

    // -------------------------------------------------------------
    // LAYER 4: CORPORATE CANTEENS (>₹12L CTC)
    // -------------------------------------------------------------
    const lg_canteens = L.layerGroup();
    const corporateCampuses = [
      { name: "Amazon HYD HQ (Nanakramguda)", coords: [17.4162, 78.3441], staff: "15,000+ staff | Median CTC: ₹22L" },
      { name: "Microsoft Campus (Gachibowli)", coords: [17.4435, 78.3772], staff: "9,000+ engineers | Median CTC: ₹26L" },
      { name: "Google Campus (Gachibowli Main Rd)", coords: [17.4460, 78.3680], staff: "12,000+ tech staff | Median CTC: ₹24L" },
      { name: "Apple & Tech Center (Waverock)", coords: [17.4184, 78.3486], staff: "25,000+ workforce | Median CTC: ₹15L" },
      { name: "CCMB & CSIR Labs (Habsiguda)", coords: [17.4260, 78.5410], staff: "Scientists & Senior Faculty | Median CTC: ₹14L" }
    ];

    corporateCampuses.forEach(c => {
      const popup = `
        <div class="popup-box">
          <div class="popup-header" style="background:#bf360c;">${c.name}</div>
          <div class="popup-content">
            <b>Campus Scale:</b> ${c.staff}<br/>
            <b>Menu Alignment:</b> Whey Protein Shakes, 2 PM Slump Cleanses<br/>
            <b>Access Method:</b> Compass / Sodexo Master Facility Tender
          </div>
        </div>
      `;
      L.marker(c.coords, { icon: makeIcon('#e65100', 'fa-solid fa-building') })
        .bindPopup(popup)
        .addTo(lg_canteens);
    });

    // -------------------------------------------------------------
    // LAYER 5: SPORTS, PICKLEBALL & FITNESS HUBS
    // -------------------------------------------------------------
    const lg_sports = L.layerGroup();
    const sportsHubs = [
      { name: "One Golf & Southside Pickleball (Financial Dist)", coords: [17.4130, 78.3420], type: "Pickleball & Driving Range" },
      { name: "Cult.fit Signature (Jubilee Hills Rd 36)", coords: [17.4320, 78.4060], type: "High-density elite gym" },
      { name: "The Arena Pickleball Club (Kokapet)", coords: [17.4060, 78.3260], type: "Pickleball & Box Cricket" },
      { name: "Cult.fit (Knowledge City)", coords: [17.4330, 78.3810], type: "Corporate tech fitness rush" },
      { name: "Durgam Cheruvu Walkers Concourse", coords: [17.4330, 78.3890], type: "Morning fitness track" },
      { name: "Sainikpuri Club & Badminton Arena", coords: [17.4910, 78.5480], type: "Badminton & Lawn Tennis" }
    ];

    sportsHubs.forEach(s => {
      const popup = `
        <div class="popup-box">
          <div class="popup-header" style="background:#0277bd;">${s.name}</div>
          <div class="popup-content">
            <b>Type:</b> ${s.type}<br/>
            <b>Value for Being Juice:</b> Immediate post-workout protein shake and pure electrolyte capture.
          </div>
        </div>
      `;
      L.marker(s.coords, { icon: makeIcon('#0288d1', 'fa-solid fa-dumbbell') })
        .bindPopup(popup)
        .addTo(lg_sports);
    });

    // -------------------------------------------------------------
    // LAYER 6: COMPETITOR VALIDATION (STARBUCKS, BOBA BHAI, THIRD WAVE)
    // -------------------------------------------------------------
    const lg_competitors = L.layerGroup();
    const competitors = [
      { name: "Third Wave Coffee & Boba Bhai (Knowledge City)", coords: [17.4340, 78.3830] },
      { name: "Starbucks & Roastery (Jubilee Hills Rd 36)", coords: [17.4345, 78.4075] },
      { name: "Third Wave Coffee (Financial District One West)", coords: [17.4180, 78.3480] },
      { name: "Starbucks (Kokapet Golden Mile)", coords: [17.4050, 78.3250] },
      { name: "Starbucks & Boba Bhai (Himayatnagar)", coords: [17.4030, 78.4850] },
      { name: "Coffee Cup (Sainikpuri)", coords: [17.4895, 78.5475] }
    ];

    competitors.forEach(cmp => {
      L.marker(cmp.coords, { icon: makeIcon('#d81b60', 'fa-solid fa-mug-hot') })
        .bindPopup(`<b>${cmp.name}</b><br/>Validates ₹180+ discretionary beverage spending.`)
        .addTo(lg_competitors);
    });

    // -------------------------------------------------------------
    // LAYER 7: GATED SOCIETIES (>₹1.5 CR - ₹5 CR+)
    // -------------------------------------------------------------
    const lg_societies = L.layerGroup();
    const societies = [
      { name: "My Home Bhooja (Raidurg)", coords: [17.4380, 78.3840], price: "₹3.5 Cr - ₹7 Cr", units: "1,800 flats" },
      { name: "Prestige High Fields (Nanakramguda)", coords: [17.4170, 78.3490], price: "₹1.8 Cr - ₹3.5 Cr", units: "2,200 flats" },
      { name: "My Home Tarkshya (Kokapet)", coords: [17.4020, 78.3230], price: "₹2.2 Cr - ₹4.5 Cr", units: "1,600 flats" },
      { name: "Jayabheri Silicon County (Hitec City)", coords: [17.4470, 78.3750], price: "₹2.0 Cr - ₹4.0 Cr", units: "900 flats" },
      { name: "Aparna Sarovar & CyberLife (Nallagandla)", coords: [17.4720, 78.3180], price: "₹1.5 Cr - ₹3.0 Cr", units: "2,500 flats" }
    ];

    societies.forEach(soc => {
      L.marker(soc.coords, { icon: makeIcon('#455a64', 'fa-solid fa-house') })
        .bindPopup(`<b>${soc.name}</b><br/>Property Valuation: ${soc.price}<br/>Units: ${soc.units}`)
        .addTo(lg_societies);
    });

    // -------------------------------------------------------------
    // 8. ADD DEFAULT ACTIVE LAYERS
    // -------------------------------------------------------------
    lg_nano.addTo(map);
    lg_stores.addTo(map);
    lg_gourmet.addTo(map);
    lg_canteens.addTo(map);
    lg_sports.addTo(map);
    lg_competitors.addTo(map);
    lg_societies.addTo(map);

    // -------------------------------------------------------------
    // 9. LAYER CONTROLLER
    // -------------------------------------------------------------
    const overlays = {
      "📍 3 km Nano-Markets (NM-01 to NM-06)": lg_nano,
      "🟢 Target Being Juice Launch Pins": lg_stores,
      "🟣 Gourmet Grocers (Q-Mart / Ratnadeep SIS)": lg_gourmet,
      "🟠 Corporate Canteens (>₹12L CTC)": lg_canteens,
      "🔵 Pickleball Courts & Cult Gyms": lg_sports,
      "🔴 Starbucks / Boba Bhai / Third Wave": lg_competitors,
      "⚫ Gated Communities (>₹1.5 Cr Valuation)": lg_societies
    };

    L.control.layers(null, overlays, { collapsed: false, position: 'topright' }).addTo(map);
  </script>
</body>
</html>
